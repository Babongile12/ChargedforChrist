<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Charged For Christ • Song Manager</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #F9F6F0;
            color: #1A1A1A;
            padding: 20px;
        }

        .container { max-width: 1000px; margin: 0 auto; }

        /* HEADER */
        .header {
            background: #4A2C2A;
            padding: 20px 30px;
            border-radius: 16px 16px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 { color: #F9F6F0; font-size: 2rem; font-family: Georgia, serif; }
        .header small { color: #D4C5B2; display: block; font-size: 0.9rem; }
        .header .conn-status {
            padding: 8px 20px;
            border-radius: 30px;
            font-weight: bold;
            color: white;
            background: #2E7D32;
            transition: background 0.3s;
        }

        /* NAV */
        .nav {
            background: #2A1A18;
            border-radius: 0 0 16px 16px;
            margin-bottom: 30px;
            display: flex;
            gap: 4px;
            padding: 8px 12px;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .nav button {
            flex: 1;
            background: transparent;
            color: #D4C5B2;
            border: none;
            padding: 12px 10px;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            font-family: inherit;
            transition: 0.2s;
        }
        .nav button:hover { background: #4A2C2A; color: #F9F6F0; }
        .nav button.active { background: #A67B5B; color: #1A1A1A; }
        .nav button:focus-visible, .btn:focus-visible { outline: 3px solid #A67B5B; outline-offset: 2px; }

        /* CARDS */
        .card {
            background: #F3EBE1;
            padding: 25px;
            border-radius: 16px;
            border-left: 6px solid #A67B5B;
            margin-bottom: 25px;
        }
        .card h2 { color: #4A2C2A; margin-bottom: 15px; font-family: Georgia, serif; }

        /* FORM */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-weight: 600; color: #4A2C2A; margin-bottom: 5px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }

        @media (max-width: 600px) {
            .form-row, .form-row-3 { grid-template-columns: 1fr; }
            .header h1 { font-size: 1.5rem; }
            body { padding: 12px; }
        }

        input, textarea {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #D4C5B2;
            border-radius: 10px;
            font-size: 1rem;
            background: white;
            font-family: inherit;
        }
        textarea { min-height: 120px; resize: vertical; }
        textarea.short { min-height: 80px; }
        input:focus, textarea:focus { outline: none; border-color: #A67B5B; }

        /* BUTTONS */
        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.95rem;
            cursor: pointer;
            transition: 0.3s;
            font-family: inherit;
        }
        .btn-success { background: #2E7D32; color: white; }
        .btn-success:hover { background: #1B5E20; }
        .btn-danger { background: #C62828; color: white; }
        .btn-danger:hover { background: #8E0000; }
        .btn-primary { background: #A67B5B; color: #1A1A1A; }
        .btn-primary:hover { background: #8B6B4F; }
        .btn-dark { background: #4A2C2A; color: #F9F6F0; }
        .btn-dark:hover { background: #2A1A18; }
        .btn-small { padding: 5px 14px; font-size: 0.8rem; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* RECORDER */
        .recorder {
            display: flex;
            gap: 12px;
            align-items: center;
            flex-wrap: wrap;
            padding: 15px;
            background: #F9F6F0;
            border-radius: 12px;
            border: 2px dashed #D4C5B2;
            margin-top: 10px;
        }
        .recorder .status { color: #5C4A3A; font-style: italic; }
        .recorder .timer { font-weight: bold; color: #4A2C2A; min-width: 60px; }
        .recording-indicator { display: none; color: #C62828; font-weight: bold; }
        .recording-indicator.active { display: inline; }

        /* SONG LIST */
        .song-item {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #D4C5B2;
            margin-bottom: 10px;
        }
        .song-item .top-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .song-item .title { font-size: 1.1rem; font-weight: 700; color: #4A2C2A; }
        .key { background: #D4C5B2; padding: 2px 12px; border-radius: 20px; font-size: 0.8rem; margin-left: 10px; }
        .song-item .audio-indicator { color: #2E7D32; margin-left: 8px; }
        .actions { display: flex; gap: 8px; flex-wrap: wrap; }
        .lyrics-preview {
            margin-top: 8px;
            color: #5C4A3A;
            font-size: 0.9rem;
            padding: 8px 12px;
            background: #F9F6F0;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }
        .lyrics-preview:hover { background: #F3EBE1; }
        .lyrics-preview .preview-text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 80%; }

        /* HOME: NEXT PERFORMANCE */
        .next-event {
            background: #4A2C2A;
            color: #F9F6F0;
            border-radius: 16px;
            padding: 30px;
            margin-bottom: 25px;
        }
        .next-event .countdown {
            display: inline-block;
            background: #A67B5B;
            color: #1A1A1A;
            padding: 4px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 0.85rem;
            margin-bottom: 12px;
        }
        .next-event h2 { font-family: Georgia, serif; font-size: 2rem; margin-bottom: 4px; }
        .next-event .when { color: #D4C5B2; font-size: 1.1rem; margin-bottom: 18px; }
        .event-details { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
        .event-details .detail { background: rgba(249, 246, 240, 0.1); padding: 12px 16px; border-radius: 12px; }
        .event-details .detail span { display: block; color: #D4C5B2; font-size: 0.85rem; }
        .event-details .detail strong { font-size: 1.05rem; }
        .event-notes { margin-top: 14px; padding: 12px 16px; background: rgba(249, 246, 240, 0.1); border-radius: 12px; white-space: pre-wrap; }

        .setlist-item {
            background: white;
            border: 1px solid #D4C5B2;
            border-radius: 12px;
            padding: 12px 16px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 14px;
            cursor: pointer;
            transition: 0.2s;
        }
        .setlist-item:hover { background: #FBF8F3; border-color: #A67B5B; }
        .setlist-item .num {
            background: #4A2C2A;
            color: #F9F6F0;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            flex-shrink: 0;
        }
        .setlist-item .info { flex: 1; min-width: 0; }
        .setlist-item .info .title { font-weight: 700; color: #4A2C2A; }

        /* EVENTS PAGE */
        .picker {
            max-height: 260px;
            overflow-y: auto;
            background: white;
            border: 2px solid #D4C5B2;
            border-radius: 10px;
            padding: 6px;
            margin-top: 8px;
        }
        .picker label {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            color: #1A1A1A;
            margin: 0;
        }
        .picker label:hover { background: #F3EBE1; }
        .picker input[type="checkbox"] { width: 20px; height: 20px; flex-shrink: 0; accent-color: #4A2C2A; }

        .order-item {
            display: flex;
            align-items: center;
            gap: 10px;
            background: white;
            border: 1px solid #D4C5B2;
            border-radius: 10px;
            padding: 8px 12px;
            margin-bottom: 6px;
        }
        .order-item .num { font-weight: 700; color: #4A2C2A; min-width: 24px; }
        .order-item .name { flex: 1; font-weight: 600; min-width: 0; }
        .order-item .btn-small { padding: 5px 11px; }

        .event-row {
            background: white;
            padding: 15px 20px;
            border-radius: 12px;
            border: 1px solid #D4C5B2;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 10px;
        }
        .event-row .e-title { font-weight: 700; color: #4A2C2A; font-size: 1.05rem; }
        .event-row .e-sub { color: #5C4A3A; font-size: 0.9rem; margin-top: 2px; }
        .event-row.past { opacity: 0.8; }

        .section-label { color: #4A2C2A; font-weight: 700; margin: 18px 0 8px; }

        /* MODAL */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal {
            background: #F9F6F0;
            border-radius: 20px;
            max-width: 700px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 35px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }
        .modal .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 15px; }
        .modal .modal-header h2 { color: #4A2C2A; font-family: Georgia, serif; font-size: 1.8rem; }
        .modal .close-btn {
            background: #C62828; color: white; border: none; border-radius: 50%;
            width: 40px; height: 40px; font-size: 1.5rem; cursor: pointer;
            display: flex; align-items: center; justify-content: center; flex-shrink: 0;
        }
        .modal .close-btn:hover { background: #8E0000; }
        .modal .meta { color: #5C4A3A; margin-bottom: 15px; }
        .modal .lyrics-full {
            background: white; padding: 25px; border-radius: 12px; border: 1px solid #D4C5B2;
            white-space: pre-wrap; font-family: Georgia, serif; line-height: 2; font-size: 1.05rem;
            max-height: 400px; overflow-y: auto; margin: 15px 0;
        }
        .modal .notes-section { background: #F3EBE1; padding: 15px; border-radius: 12px; border-left: 4px solid #A67B5B; margin: 10px 0; }
        .modal .audio-section { margin: 15px 0; padding: 15px; background: #F3EBE1; border-radius: 12px; text-align: center; }
        .modal .audio-section audio { width: 100%; max-width: 400px; }
        .modal .modal-actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 20px; }

        /* SEARCH */
        .search-box { margin-bottom: 15px; }
        .search-box input { padding: 12px 18px; }

        /* UTILITY */
        .text-muted { color: #5C4A3A; }
        .mt-10 { margin-top: 10px; }
        .footer { text-align: center; padding: 20px; color: #5C4A3A; border-top: 1px solid #D4C5B2; margin-top: 30px; }
        .empty-state { text-align: center; padding: 40px 20px; color: #5C4A3A; }
        .empty-state .icon { font-size: 4rem; display: block; margin-bottom: 15px; }
        .empty-state .btn { margin-top: 15px; }
        .hidden { display: none !important; }

        @media (max-width: 600px) {
            .modal-overlay { padding: 0; }
            .modal { max-width: 100%; width: 100%; height: 100%; max-height: 100%; border-radius: 0; }
            .next-event { padding: 22px; }
            .next-event h2 { font-size: 1.5rem; }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- HEADER -->
        <div class="header">
            <div>
                <h1>⚜️ Charged For Christ</h1>
                <small>Song Manager</small>
            </div>
            <div class="conn-status" id="connStatus">🟢 Connecting…</div>
        </div>

        <!-- NAV BAR -->
        <nav class="nav" id="nav">
            <button data-page="home" class="active">Home</button>
            <button data-page="songs">Songs</button>
            <button data-page="events">Events</button>
        </nav>

        <!-- ===================== HOME PAGE ===================== -->
        <div class="page" id="page-home">
            <div id="homeContent"></div>
        </div>

        <!-- ===================== SONGS PAGE ===================== -->
        <div class="page hidden" id="page-songs">

            <div class="card" id="songFormCard" style="border-left-color: #2E7D32;">
                <h2>➕ Add / Edit Song</h2>

                <div class="form-row">
                    <div class="form-group">
                        <label for="songTitle">Song Title *</label>
                        <input type="text" id="songTitle" placeholder="e.g. 'Amazing Grace'" />
                    </div>
                    <div class="form-group">
                        <label for="songKey">Musical Key</label>
                        <input type="text" id="songKey" placeholder="e.g. 'Ab'" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="songLyrics">Lyrics</label>
                    <textarea id="songLyrics" placeholder="Paste the full lyrics here..."></textarea>
                </div>

                <div class="form-group">
                    <label for="songNotes">Practice Notes</label>
                    <textarea id="songNotes" placeholder="e.g. 'Bass 2 comes in on beat 3'"></textarea>
                </div>

                <!-- AUDIO RECORDER -->
                <div class="form-group">
                    <label>🎤 Record 5-Second Key</label>
                    <div class="recorder">
                        <button id="recordBtn" class="btn btn-danger btn-small">🔴 Record</button>
                        <span class="timer" id="timerDisplay">0.0s / 5s</span>
                        <span class="recording-indicator" id="recordingIndicator">● RECORDING</span>
                        <button id="playbackBtn" class="btn btn-primary btn-small" disabled>▶️ Play</button>
                        <button id="clearAudioBtn" class="btn btn-danger btn-small" disabled>✕ Clear</button>
                        <span class="status" id="audioStatus">No recording</span>
                    </div>
                </div>

                <button id="saveSongBtn" class="btn btn-success">💾 Save Song</button>
                <button id="cancelSongBtn" class="btn btn-dark hidden">Cancel edit</button>
                <div id="formFeedback" class="mt-10" style="font-weight:600;"></div>
            </div>

            <div class="card">
                <h2>📚 Song Library <span class="text-muted" id="songCount" style="font-size:1rem; font-family:'Segoe UI',sans-serif;">0 Songs</span></h2>

                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="🔍 Search songs..." />
                </div>

                <div id="songList"></div>
            </div>
        </div>

        <!-- ===================== EVENTS PAGE ===================== -->
        <div class="page hidden" id="page-events">

            <div class="card" id="eventFormCard" style="border-left-color: #2E7D32;">
                <h2 id="eventFormTitle">➕ Add Event</h2>

                <div class="form-group">
                    <label for="eventName">Event Name</label>
                    <input type="text" id="eventName" placeholder="e.g. 'Sunday Morning Service'" />
                </div>

                <div class="form-row-3">
                    <div class="form-group">
                        <label for="eventDate">Date *</label>
                        <input type="date" id="eventDate" />
                    </div>
                    <div class="form-group">
                        <label for="eventTime">Time</label>
                        <input type="time" id="eventTime" />
                    </div>
                    <div class="form-group">
                        <label for="eventVenue">Venue *</label>
                        <input type="text" id="eventVenue" placeholder="e.g. 'Grace Chapel'" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="eventDress">Dress Code</label>
                    <input type="text" id="eventDress" placeholder="e.g. 'Black and gold'" />
                </div>

                <div class="form-group">
                    <label for="eventNotes">Notes</label>
                    <textarea id="eventNotes" class="short" placeholder="e.g. 'Soundcheck at 8:30'"></textarea>
                </div>

                <div class="form-group">
                    <label>🎶 Choose Songs</label>
                    <input type="text" id="pickerSearch" placeholder="🔍 Search your songs..." />
                    <div class="picker" id="songPicker"></div>
                </div>

                <div class="form-group">
                    <label>📋 Setlist Order <span class="text-muted" id="setlistCount" style="font-weight:400;"></span></label>
                    <div id="setlistOrder"></div>
                </div>

                <button id="saveEventBtn" class="btn btn-success">💾 Save Event</button>
                <button id="cancelEventBtn" class="btn btn-dark hidden">Cancel edit</button>
                <div id="eventFeedback" class="mt-10" style="font-weight:600;"></div>
            </div>

            <div class="card">
                <h2>📅 Upcoming Events</h2>
                <div id="upcomingList"></div>
            </div>

            <div class="card" style="border-left-color: #5C4A3A;">
                <h2>🕰️ Past Events</h2>
                <div id="pastList"></div>
            </div>
        </div>

        <div class="footer">Charged For Christ • Soli Deo Gloria</div>

    </div>

    <!-- ===== SONG DETAIL MODAL ===== -->
    <div class="modal-overlay" id="songModal">
        <div class="modal">
            <div class="modal-header">
                <h2 id="modalTitle">Song Title</h2>
                <button class="close-btn" id="closeModalBtn">✕</button>
            </div>
            <div class="meta" id="modalMeta">Key: N/A</div>

            <div id="modalAudioContainer" class="audio-section" style="display:none;">
                <p style="margin-bottom:8px; font-weight:600;">🎵 Recorded Key:</p>
                <audio id="modalAudio" controls></audio>
            </div>

            <div class="lyrics-full" id="modalLyrics">No lyrics added yet.</div>

            <div id="modalNotesContainer" class="notes-section" style="display:none;">
                <strong>📝 Notes:</strong><br />
                <span id="modalNotesText"></span>
            </div>

            <div class="modal-actions">
                <button class="btn btn-primary" id="modalEditBtn">✏️ Edit Song</button>
                <button class="btn btn-danger" id="modalDeleteBtn">🗑️ Delete Song</button>
            </div>
        </div>
    </div>

    <!-- Firebase (compat SDK) -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

    <script>
        // ============================================================
        //  CHARGED FOR CHRIST - SONG MANAGER  (Firebase / Firestore)
        // ============================================================

        const firebaseConfig = {
            apiKey: "AIzaSyBPeMuVsZmu_KwAXMRhIsF7T_4pWtIz7G8",
            authDomain: "chargedforchrist-7ffdd.firebaseapp.com",
            projectId: "chargedforchrist-7ffdd",
            storageBucket: "chargedforchrist-7ffdd.firebasestorage.app",
            messagingSenderId: "646339933305",
            appId: "1:646339933305:web:d07f9c8e8d8c9d77a150a8"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();
        const songsCollection = db.collection('songs');
        const eventsCollection = db.collection('events');   // NEW collection for events

        db.enablePersistence().catch((err) => {
            console.warn('Offline persistence not enabled:', err.code);
        });

        // --- DOM REFS: songs ---
        const songTitle = document.getElementById('songTitle');
        const songKey = document.getElementById('songKey');
        const songLyrics = document.getElementById('songLyrics');
        const songNotes = document.getElementById('songNotes');
        const saveBtn = document.getElementById('saveSongBtn');
        const cancelSongBtn = document.getElementById('cancelSongBtn');
        const songList = document.getElementById('songList');
        const searchInput = document.getElementById('searchInput');
        const songCount = document.getElementById('songCount');
        const formFeedback = document.getElementById('formFeedback');
        const connStatus = document.getElementById('connStatus');

        const recordBtn = document.getElementById('recordBtn');
        const playbackBtn = document.getElementById('playbackBtn');
        const clearAudioBtn = document.getElementById('clearAudioBtn');
        const timerDisplay = document.getElementById('timerDisplay');
        const audioStatus = document.getElementById('audioStatus');
        const recordingIndicator = document.getElementById('recordingIndicator');

        // --- DOM REFS: modal ---
        const modal = document.getElementById('songModal');
        const closeModalBtn = document.getElementById('closeModalBtn');
        const modalTitle = document.getElementById('modalTitle');
        const modalMeta = document.getElementById('modalMeta');
        const modalLyrics = document.getElementById('modalLyrics');
        const modalNotesText = document.getElementById('modalNotesText');
        const modalNotesContainer = document.getElementById('modalNotesContainer');
        const modalAudio = document.getElementById('modalAudio');
        const modalAudioContainer = document.getElementById('modalAudioContainer');
        const modalEditBtn = document.getElementById('modalEditBtn');
        const modalDeleteBtn = document.getElementById('modalDeleteBtn');

        // --- DOM REFS: events ---
        const eventName = document.getElementById('eventName');
        const eventDate = document.getElementById('eventDate');
        const eventTime = document.getElementById('eventTime');
        const eventVenue = document.getElementById('eventVenue');
        const eventDress = document.getElementById('eventDress');
        const eventNotes = document.getElementById('eventNotes');
        const pickerSearch = document.getElementById('pickerSearch');
        const songPicker = document.getElementById('songPicker');
        const setlistOrder = document.getElementById('setlistOrder');
        const setlistCount = document.getElementById('setlistCount');
        const saveEventBtn = document.getElementById('saveEventBtn');
        const cancelEventBtn = document.getElementById('cancelEventBtn');
        const eventFeedback = document.getElementById('eventFeedback');
        const eventFormTitle = document.getElementById('eventFormTitle');
        const upcomingList = document.getElementById('upcomingList');
        const pastList = document.getElementById('pastList');
        const homeContent = document.getElementById('homeContent');

        // --- STATE ---
        let songs = [];
        let events = [];
        let editingId = null;          // song being edited
        let editingEventId = null;     // event being edited
        let selectedSongIds = [];      // ordered setlist for the event form
        let viewingId = null;
        let audioBlob = null;
        let mediaRecorder = null;
        let isRecording = false;
        let recordingTimer = null;
        let recordingSeconds = 0;

        let isOnline = navigator.onLine;
        let pendingSongs = false;
        let pendingEvents = false;

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        // ============================================================
        //  PAGE NAVIGATION
        // ============================================================
        const PAGES = ['home', 'songs', 'events'];

        function showPage(page) {
            if (!PAGES.includes(page)) page = 'home';
            PAGES.forEach(p => {
                document.getElementById('page-' + p).classList.toggle('hidden', p !== page);
            });
            document.querySelectorAll('#nav button').forEach(b => {
                b.classList.toggle('active', b.dataset.page === page);
            });
            if (location.hash !== '#' + page) {
                history.replaceState(null, '', '#' + page);
            }
            window.scrollTo(0, 0);
        }

        document.querySelectorAll('#nav button').forEach(b => {
            b.addEventListener('click', () => showPage(b.dataset.page));
        });
        window.addEventListener('hashchange', () => showPage(location.hash.replace('#', '')));

        // ============================================================
        //  CONNECTION / SYNC STATUS BADGE
        // ============================================================
        function updateStatusBadge() {
            if (!isOnline) {
                connStatus.textContent = '🟡 Offline — saved locally';
                connStatus.style.background = '#C62828';
            } else if (pendingSongs || pendingEvents) {
                connStatus.textContent = '🔄 Syncing...';
                connStatus.style.background = '#A67B5B';
            } else {
                connStatus.textContent = '🟢 Live';
                connStatus.style.background = '#2E7D32';
            }
        }

        window.addEventListener('online', () => { isOnline = true; updateStatusBadge(); });
        window.addEventListener('offline', () => { isOnline = false; updateStatusBadge(); });
        updateStatusBadge();

        // ============================================================
        //  REAL-TIME LISTENERS
        // ============================================================
        function initSongsListener() {
            songsCollection.orderBy('created', 'desc').onSnapshot(
                (snapshot) => {
                    songs = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    pendingSongs = snapshot.metadata.hasPendingWrites;
                    updateStatusBadge();
                    renderSongs(searchInput.value);
                    updateCount();
                    renderPicker();
                    renderSetlistOrder();
                    renderEvents();
                    renderHome();
                },
                (error) => {
                    console.error('Firestore songs listener error:', error);
                    formFeedback.style.color = '#C62828';
                    formFeedback.textContent = '⚠️ Could not connect to the database: ' + error.message;
                }
            );
        }

        function initEventsListener() {
            eventsCollection.orderBy('date', 'asc').onSnapshot(
                (snapshot) => {
                    events = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    pendingEvents = snapshot.metadata.hasPendingWrites;
                    updateStatusBadge();
                    renderEvents();
                    renderHome();
                },
                (error) => {
                    console.error('Firestore events listener error:', error);
                    eventFeedback.style.color = '#C62828';
                    eventFeedback.textContent = '⚠️ Could not load events: ' + error.message;
                }
            );
        }

        // ============================================================
        //  DATE HELPERS
        // ============================================================
        function todayStr() {
            const d = new Date();
            return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        }

        function parseDate(str) {
            const [y, m, d] = (str || '').split('-').map(Number);
            return new Date(y, (m || 1) - 1, d || 1);
        }

        function formatDate(str) {
            if (!str) return '';
            return parseDate(str).toLocaleDateString('en-ZA', {
                weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
            });
        }

        function formatShortDate(str) {
            if (!str) return '';
            return parseDate(str).toLocaleDateString('en-ZA', {
                weekday: 'short', day: 'numeric', month: 'short', year: 'numeric'
            });
        }

        function daysUntil(str) {
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            return Math.round((parseDate(str) - today) / 86400000);
        }

        function countdownText(str) {
            const n = daysUntil(str);
            if (n === 0) return 'Today';
            if (n === 1) return 'Tomorrow';
            return 'In ' + n + ' days';
        }

        function eventSortKey(e) { return (e.date || '') + ' ' + (e.time || ''); }

        function getUpcoming() {
            const t = todayStr();
            return events.filter(e => e.date >= t).sort((a, b) => eventSortKey(a).localeCompare(eventSortKey(b)));
        }

        function getPast() {
            const t = todayStr();
            return events.filter(e => e.date < t).sort((a, b) => eventSortKey(b).localeCompare(eventSortKey(a)));
        }

        function songsForEvent(ev) {
            return (ev.songIds || []).map(id => songs.find(s => s.id === id)).filter(Boolean);
        }

        // ============================================================
        //  HOME PAGE
        // ============================================================
        function renderHome() {
            const next = getUpcoming()[0];

            if (!next) {
                homeContent.innerHTML = `
                    <div class="card">
                        <div class="empty-state">
                            <span class="icon">📅</span>
                            <p><strong>No upcoming performances</strong></p>
                            <button class="btn btn-success" onclick="showPage('events')">➕ Add an event</button>
                        </div>
                    </div>`;
                return;
            }

            const list = songsForEvent(next);
            const title = next.name || next.venue;
            const timeText = next.time ? ' at ' + escapeHtml(next.time) : '';

            const details = `
                <div class="event-details">
                    <div class="detail"><span>📍 Venue</span><strong>${escapeHtml(next.venue)}</strong></div>
                    ${next.time ? `<div class="detail"><span>🕒 Time</span><strong>${escapeHtml(next.time)}</strong></div>` : ''}
                    ${next.dressCode ? `<div class="detail"><span>👔 Dress code</span><strong>${escapeHtml(next.dressCode)}</strong></div>` : ''}
                </div>
                ${next.notes ? `<div class="event-notes">📝 ${escapeHtml(next.notes)}</div>` : ''}`;

            const setlist = list.length === 0
                ? `<div class="empty-state"><span class="icon">🎶</span><p>No songs picked for this event yet.</p>
                       <button class="btn btn-primary" onclick="editEvent('${next.id}')">✏️ Add songs</button></div>`
                : list.map((song, i) => `
                    <div class="setlist-item" onclick="viewSong('${song.id}')">
                        <div class="num">${i + 1}</div>
                        <div class="info">
                            <span class="title">${escapeHtml(song.title)}</span>
                            <span class="key">${escapeHtml(song.key)}</span>
                        </div>
                        ${song.audioBase64 ? `<button class="btn btn-primary btn-small" onclick="event.stopPropagation(); playAudio('${song.id}')">▶️ Play Key</button>` : ''}
                        <span style="color:#A67B5B; font-weight:600;">Lyrics →</span>
                    </div>`).join('');

            homeContent.innerHTML = `
                <div class="next-event">
                    <span class="countdown">${countdownText(next.date)}</span>
                    <h2>${escapeHtml(title)}</h2>
                    <div class="when">${escapeHtml(formatDate(next.date))}${timeText}</div>
                    ${details}
                </div>
                <div class="card">
                    <h2>🎶 Songs for this event <span class="text-muted" style="font-size:1rem; font-family:'Segoe UI',sans-serif;">${list.length} song${list.length !== 1 ? 's' : ''}</span></h2>
                    ${setlist}
                    <div class="mt-10"><button class="btn btn-dark btn-small" onclick="editEvent('${next.id}')">✏️ Edit this event</button></div>
                </div>`;
        }

        // ============================================================
        //  SONGS PAGE: RENDER
        // ============================================================
        function renderSongs(filter = '') {
            const term = filter.toLowerCase().trim();
            let filtered = songs;
            if (term) {
                filtered = songs.filter(s =>
                    (s.title || '').toLowerCase().includes(term) ||
                    (s.key || '').toLowerCase().includes(term) ||
                    (s.lyrics || '').toLowerCase().includes(term)
                );
            }

            if (filtered.length === 0) {
                songList.innerHTML = `
                    <div class="empty-state">
                        <span class="icon">🎵</span>
                        <p>${songs.length === 0 ? 'No songs yet. Add one above!' : 'No matches.'}</p>
                    </div>`;
                return;
            }

            songList.innerHTML = filtered.map(song => {
                const hasAudio = song.audioBase64 ? '🎵' : '';
                const preview = song.lyrics ? song.lyrics.substring(0, 100) : 'No lyrics';
                const previewDisplay = song.lyrics ? preview + (song.lyrics.length > 100 ? '...' : '') : 'No lyrics';

                return `
                    <div class="song-item" data-id="${song.id}">
                        <div class="top-row">
                            <div>
                                <span class="title">${escapeHtml(song.title)}</span>
                                <span class="key">${escapeHtml(song.key)}</span>
                                <span class="audio-indicator">${hasAudio}</span>
                            </div>
                            <div class="actions">
                                ${song.audioBase64 ? `<button class="btn btn-primary btn-small" onclick="playAudio('${song.id}')">▶️ Play Key</button>` : ''}
                                <button class="btn btn-primary btn-small" onclick="editSong('${song.id}')">✏️ Edit</button>
                                <button class="btn btn-danger btn-small" onclick="deleteSong('${song.id}')">🗑️</button>
                            </div>
                        </div>
                        <div class="lyrics-preview" onclick="viewSong('${song.id}')">
                            <span class="preview-text">📖 ${escapeHtml(previewDisplay)}</span>
                            <span style="color:#A67B5B; font-weight:600;">View Lyrics →</span>
                        </div>
                    </div>`;
            }).join('');
        }

        function updateCount() {
            songCount.textContent = `${songs.length} Song${songs.length !== 1 ? 's' : ''}`;
        }

        // ============================================================
        //  VIEW SONG (modal)
        // ============================================================
        function viewSong(id) {
            const song = songs.find(s => s.id === id);
            if (!song) return;

            viewingId = id;
            modalTitle.textContent = song.title;
            modalMeta.textContent = `Key: ${song.key}`;
            modalLyrics.textContent = song.lyrics || 'No lyrics added yet.';

            if (song.notes) {
                modalNotesContainer.style.display = 'block';
                modalNotesText.textContent = song.notes;
            } else {
                modalNotesContainer.style.display = 'none';
            }

            if (song.audioBase64) {
                modalAudioContainer.style.display = 'block';
                const blob = base64ToBlob(song.audioBase64);
                modalAudio.src = URL.createObjectURL(blob);
                modalAudio.load();
            } else {
                modalAudioContainer.style.display = 'none';
                modalAudio.src = '';
            }

            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
            modalAudio.pause();
        }

        closeModalBtn.addEventListener('click', closeModal);
        modal.addEventListener('click', (e) => { if (e.target === modal) closeModal(); });
        document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeModal(); });

        function playAudio(id) {
            const song = songs.find(s => s.id === id);
            if (!song || !song.audioBase64) return;
            const audio = new Audio(URL.createObjectURL(base64ToBlob(song.audioBase64)));
            audio.play();
        }

        // ============================================================
        //  SAVE SONG
        // ============================================================
        async function saveSong() {
            const title = songTitle.value.trim();
            if (!title) {
                formFeedback.style.color = '#C62828';
                formFeedback.textContent = '⚠️ Please enter a title.';
                return;
            }

            let audioBase64 = null;
            if (audioBlob) {
                audioBase64 = await blobToBase64(audioBlob);
            }

            const newSong = {
                title: title,
                key: songKey.value.trim() || 'N/A',
                lyrics: songLyrics.value.trim(),
                notes: songNotes.value.trim(),
                audioBase64: audioBase64
            };

            try {
                if (editingId) {
                    await songsCollection.doc(editingId).update(newSong);
                    formFeedback.style.color = '#2E7D32';
                    formFeedback.textContent = `✅ "${title}" updated!`;
                } else {
                    newSong.created = firebase.firestore.FieldValue.serverTimestamp();
                    await songsCollection.add(newSong);
                    formFeedback.style.color = '#2E7D32';
                    formFeedback.textContent = `✅ "${title}" added!`;
                }
                const msg = formFeedback.textContent;
                clearForm();
                formFeedback.style.color = '#2E7D32';
                formFeedback.textContent = msg;
            } catch (err) {
                console.error('Save failed:', err);
                formFeedback.style.color = '#C62828';
                formFeedback.textContent = '⚠️ Save failed: ' + err.message;
            }

            setTimeout(() => { formFeedback.textContent = ''; }, 3000);
        }

        // ============================================================
        //  EDIT SONG
        // ============================================================
        function editSong(id) {
            const song = songs.find(s => s.id === id);
            if (!song) return;

            closeModal();
            showPage('songs');
            editingId = id;
            songTitle.value = song.title;
            songKey.value = song.key;
            songLyrics.value = song.lyrics;
            songNotes.value = song.notes;

            if (song.audioBase64) {
                audioBlob = base64ToBlob(song.audioBase64);
                audioStatus.textContent = '✅ Audio loaded';
                playbackBtn.disabled = false;
                clearAudioBtn.disabled = false;
            } else {
                audioBlob = null;
                audioStatus.textContent = 'No recording';
                playbackBtn.disabled = true;
                clearAudioBtn.disabled = true;
            }

            saveBtn.textContent = '🔄 Update Song';
            cancelSongBtn.classList.remove('hidden');
            formFeedback.style.color = '#4A2C2A';
            formFeedback.textContent = `✏️ Editing "${song.title}"`;

            document.getElementById('songFormCard').scrollIntoView({ behavior: 'smooth' });
        }

        // ============================================================
        //  DELETE SONG
        // ============================================================
        async function deleteSong(id) {
            const song = songs.find(s => s.id === id);
            if (!song) return;

            const usedIn = events.filter(e => (e.songIds || []).includes(id)).length;
            const extra = usedIn ? `\n\nIt is used in ${usedIn} event${usedIn !== 1 ? 's' : ''} and will disappear from those setlists.` : '';
            if (!confirm(`Delete "${song.title}" permanently?${extra}`)) return;

            try {
                await songsCollection.doc(id).delete();
            } catch (err) {
                console.error('Delete failed:', err);
                alert('Delete failed: ' + err.message);
                return;
            }

            closeModal();

            // Also drop it from the event form if it was ticked there
            selectedSongIds = selectedSongIds.filter(sid => sid !== id);
            renderPicker();
            renderSetlistOrder();

            if (editingId === id) clearForm();
        }

        // ============================================================
        //  CLEAR SONG FORM
        // ============================================================
        function clearForm() {
            songTitle.value = '';
            songKey.value = '';
            songLyrics.value = '';
            songNotes.value = '';
            audioBlob = null;
            audioStatus.textContent = 'No recording';
            playbackBtn.disabled = true;
            clearAudioBtn.disabled = true;
            editingId = null;
            saveBtn.textContent = '💾 Save Song';
            cancelSongBtn.classList.add('hidden');
            formFeedback.textContent = '';
            timerDisplay.textContent = '0.0s / 5s';
        }

        // ============================================================
        //  EVENTS PAGE: SONG PICKER + SETLIST ORDER
        // ============================================================
        function renderPicker() {
            const term = pickerSearch.value.toLowerCase().trim();
            let list = songs.slice().sort((a, b) => (a.title || '').localeCompare(b.title || ''));
            if (term) list = list.filter(s => (s.title || '').toLowerCase().includes(term));

            if (songs.length === 0) {
                songPicker.innerHTML = `<div class="empty-state" style="padding:20px;">No songs yet. Add some on the Songs page first.</div>`;
                return;
            }
            if (list.length === 0) {
                songPicker.innerHTML = `<div class="empty-state" style="padding:20px;">No matches.</div>`;
                return;
            }

            songPicker.innerHTML = list.map(s => `
                <label>
                    <input type="checkbox" ${selectedSongIds.includes(s.id) ? 'checked' : ''} onchange="toggleSong('${s.id}', this.checked)" />
                    <span>${escapeHtml(s.title)} <span class="key">${escapeHtml(s.key)}</span></span>
                </label>`).join('');
        }

        function toggleSong(id, checked) {
            if (checked && !selectedSongIds.includes(id)) {
                selectedSongIds.push(id);
            } else if (!checked) {
                selectedSongIds = selectedSongIds.filter(s => s !== id);
            }
            renderSetlistOrder();
        }

        function renderSetlistOrder() {
            // Ignore songs that no longer exist
            selectedSongIds = selectedSongIds.filter(id => songs.some(s => s.id === id));
            setlistCount.textContent = selectedSongIds.length
                ? `(${selectedSongIds.length} song${selectedSongIds.length !== 1 ? 's' : ''})`
                : '';

            if (selectedSongIds.length === 0) {
                setlistOrder.innerHTML = `<p class="text-muted">Tick songs above and they will appear here. Use the arrows to set the order.</p>`;
                return;
            }

            setlistOrder.innerHTML = selectedSongIds.map((id, i) => {
                const s = songs.find(x => x.id === id);
                return `
                    <div class="order-item">
                        <span class="num">${i + 1}.</span>
                        <span class="name">${escapeHtml(s.title)}</span>
                        <button class="btn btn-primary btn-small" ${i === 0 ? 'disabled' : ''} onclick="moveSong(${i}, -1)" aria-label="Move up">▲</button>
                        <button class="btn btn-primary btn-small" ${i === selectedSongIds.length - 1 ? 'disabled' : ''} onclick="moveSong(${i}, 1)" aria-label="Move down">▼</button>
                        <button class="btn btn-danger btn-small" onclick="removeFromSetlist('${id}')" aria-label="Remove">✕</button>
                    </div>`;
            }).join('');
        }

        function moveSong(index, dir) {
            const target = index + dir;
            if (target < 0 || target >= selectedSongIds.length) return;
            [selectedSongIds[index], selectedSongIds[target]] = [selectedSongIds[target], selectedSongIds[index]];
            renderSetlistOrder();
        }

        function removeFromSetlist(id) {
            selectedSongIds = selectedSongIds.filter(s => s !== id);
            renderPicker();
            renderSetlistOrder();
        }

        pickerSearch.addEventListener('input', renderPicker);

        // ============================================================
        //  EVENTS PAGE: SAVE / EDIT / DELETE
        // ============================================================
        async function saveEvent() {
            const date = eventDate.value;
            const venue = eventVenue.value.trim();

            if (!date || !venue) {
                eventFeedback.style.color = '#C62828';
                eventFeedback.textContent = '⚠️ Please enter a date and a venue.';
                return;
            }

            const data = {
                name: eventName.value.trim(),
                date: date,
                time: eventTime.value,
                venue: venue,
                dressCode: eventDress.value.trim(),
                notes: eventNotes.value.trim(),
                songIds: selectedSongIds.slice()
            };

            try {
                if (editingEventId) {
                    await eventsCollection.doc(editingEventId).update(data);
                } else {
                    data.created = firebase.firestore.FieldValue.serverTimestamp();
                    await eventsCollection.add(data);
                }
                const label = data.name || data.venue;
                const wasEditing = !!editingEventId;
                clearEventForm();
                eventFeedback.style.color = '#2E7D32';
                eventFeedback.textContent = `✅ "${label}" ${wasEditing ? 'updated' : 'added'}!`;
            } catch (err) {
                console.error('Event save failed:', err);
                eventFeedback.style.color = '#C62828';
                eventFeedback.textContent = '⚠️ Save failed: ' + err.message;
            }

            setTimeout(() => { eventFeedback.textContent = ''; }, 3000);
        }

        function editEvent(id) {
            const ev = events.find(e => e.id === id);
            if (!ev) return;

            showPage('events');
            editingEventId = id;
            eventName.value = ev.name || '';
            eventDate.value = ev.date || '';
            eventTime.value = ev.time || '';
            eventVenue.value = ev.venue || '';
            eventDress.value = ev.dressCode || '';
            eventNotes.value = ev.notes || '';
            selectedSongIds = (ev.songIds || []).slice();

            eventFormTitle.textContent = '✏️ Edit Event';
            saveEventBtn.textContent = '🔄 Update Event';
            cancelEventBtn.classList.remove('hidden');
            eventFeedback.style.color = '#4A2C2A';
            eventFeedback.textContent = `✏️ Editing "${ev.name || ev.venue}"`;

            pickerSearch.value = '';
            renderPicker();
            renderSetlistOrder();
            document.getElementById('eventFormCard').scrollIntoView({ behavior: 'smooth' });
        }

        async function deleteEvent(id) {
            const ev = events.find(e => e.id === id);
            if (!ev) return;
            if (!confirm(`Delete "${ev.name || ev.venue}" on ${formatShortDate(ev.date)}? Your songs will not be affected.`)) return;

            try {
                await eventsCollection.doc(id).delete();
            } catch (err) {
                console.error('Event delete failed:', err);
                alert('Delete failed: ' + err.message);
                return;
            }
            if (editingEventId === id) clearEventForm();
        }

        function clearEventForm() {
            eventName.value = '';
            eventDate.value = '';
            eventTime.value = '';
            eventVenue.value = '';
            eventDress.value = '';
            eventNotes.value = '';
            pickerSearch.value = '';
            selectedSongIds = [];
            editingEventId = null;
            eventFormTitle.textContent = '➕ Add Event';
            saveEventBtn.textContent = '💾 Save Event';
            cancelEventBtn.classList.add('hidden');
            eventFeedback.textContent = '';
            renderPicker();
            renderSetlistOrder();
        }

        cancelEventBtn.addEventListener('click', clearEventForm);
        cancelSongBtn.addEventListener('click', clearForm);
        saveEventBtn.addEventListener('click', saveEvent);

        function eventRowHtml(ev, isPast) {
            const count = (ev.songIds || []).length;
            const sub = [formatShortDate(ev.date), ev.time, ev.venue].filter(Boolean).map(escapeHtml).join(' • ');
            return `
                <div class="event-row ${isPast ? 'past' : ''}">
                    <div>
                        <div class="e-title">${escapeHtml(ev.name || ev.venue)}</div>
                        <div class="e-sub">${sub} • ${count} song${count !== 1 ? 's' : ''}</div>
                    </div>
                    <div class="actions">
                        <button class="btn btn-primary btn-small" onclick="editEvent('${ev.id}')">✏️ Edit</button>
                        <button class="btn btn-danger btn-small" onclick="deleteEvent('${ev.id}')">🗑️</button>
                    </div>
                </div>`;
        }

        function renderEvents() {
            const up = getUpcoming();
            const past = getPast();

            upcomingList.innerHTML = up.length
                ? up.map(e => eventRowHtml(e, false)).join('')
                : `<p class="text-muted">No upcoming events.</p>`;

            pastList.innerHTML = past.length
                ? past.map(e => eventRowHtml(e, true)).join('')
                : `<p class="text-muted">No past events yet.</p>`;
        }

        // ============================================================
        //  AUDIO RECORDER
        // ============================================================
        async function startRecording() {
            if (isRecording) return;
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                const chunks = [];

                mediaRecorder.ondataavailable = e => chunks.push(e.data);
                mediaRecorder.onstop = () => {
                    audioBlob = new Blob(chunks, { type: 'audio/webm' });
                    playbackBtn.disabled = false;
                    clearAudioBtn.disabled = false;
                    audioStatus.textContent = '✅ Recording saved!';
                    recordingIndicator.classList.remove('active');
                    isRecording = false;
                    clearInterval(recordingTimer);
                    recordBtn.textContent = '🔴 Record';
                    recordBtn.style.background = '#C62828';
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                isRecording = true;
                recordingSeconds = 0;
                timerDisplay.textContent = '0.0s / 5s';
                recordingIndicator.classList.add('active');
                recordBtn.textContent = '⏹️ Stop';
                recordBtn.style.background = '#8E0000';
                audioStatus.textContent = '🎤 Recording...';

                recordingTimer = setInterval(() => {
                    recordingSeconds += 0.1;
                    timerDisplay.textContent = `${Math.min(recordingSeconds, 5).toFixed(1)}s / 5s`;
                    if (recordingSeconds >= 5.0 && mediaRecorder && mediaRecorder.state === 'recording') {
                        mediaRecorder.stop();
                    }
                }, 100);

            } catch (err) {
                alert('Microphone access denied or unavailable. Please allow microphone permissions in your browser to record a key.');
                console.error(err);
            }
        }

        function stopRecording() {
            if (mediaRecorder && mediaRecorder.state === 'recording') mediaRecorder.stop();
        }

        function playRecordedAudio() {
            if (!audioBlob) return;
            new Audio(URL.createObjectURL(audioBlob)).play();
        }

        function clearRecordedAudio() {
            if (!confirm('Remove the recorded audio?')) return;
            audioBlob = null;
            audioStatus.textContent = 'No recording';
            playbackBtn.disabled = true;
            clearAudioBtn.disabled = true;
            timerDisplay.textContent = '0.0s / 5s';
        }

        // ============================================================
        //  MODAL BUTTONS
        // ============================================================
        modalEditBtn.addEventListener('click', () => {
            if (viewingId) {
                const id = viewingId;
                closeModal();
                editSong(id);
            }
        });
        modalDeleteBtn.addEventListener('click', () => {
            if (viewingId) deleteSong(viewingId);
        });

        // ============================================================
        //  HELPERS
        // ============================================================
        function base64ToBlob(base64) {
            const byteChars = atob(base64);
            const arr = new Uint8Array(byteChars.length);
            for (let i = 0; i < byteChars.length; i++) arr[i] = byteChars.charCodeAt(i);
            return new Blob([arr], { type: 'audio/webm' });
        }

        function blobToBase64(blob) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.onloadend = () => resolve(reader.result.split(',')[1]);
                reader.readAsDataURL(blob);
            });
        }

        // ============================================================
        //  EVENT LISTENERS
        // ============================================================
        saveBtn.addEventListener('click', saveSong);
        recordBtn.addEventListener('click', () => { isRecording ? stopRecording() : startRecording(); });
        playbackBtn.addEventListener('click', playRecordedAudio);
        clearAudioBtn.addEventListener('click', clearRecordedAudio);
        searchInput.addEventListener('input', (e) => renderSongs(e.target.value));
        songTitle.addEventListener('keypress', (e) => { if (e.key === 'Enter') saveSong(); });

        // Needed for inline onclick= handlers
        window.showPage = showPage;
        window.viewSong = viewSong;
        window.editSong = editSong;
        window.deleteSong = deleteSong;
        window.playAudio = playAudio;
        window.editEvent = editEvent;
        window.deleteEvent = deleteEvent;
        window.toggleSong = toggleSong;
        window.moveSong = moveSong;
        window.removeFromSetlist = removeFromSetlist;

        // ============================================================
        //  INIT
        // ============================================================
        showPage(location.hash.replace('#', '') || 'home');
        renderHome();
        renderEvents();
        renderSongs();
        renderPicker();
        renderSetlistOrder();
        initSongsListener();
        initEventsListener();
        console.log('⚜️ Charged For Christ loaded — connected to Firebase project: ' + firebaseConfig.projectId);
    </script>

</body>
</html>
